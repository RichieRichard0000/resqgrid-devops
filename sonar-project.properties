# ==============================================================================
# SonarQube Scanner Configuration for ResQGrid
# ==============================================================================
sonar.projectKey=resqgrid
sonar.projectName=ResQGrid Real-Time Disaster Platform
sonar.projectVersion=2.0.0

# Source and Test directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests

# Inclusions and Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,infra/**,database/migrations/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Encoding
sonar.sourceEncoding=UTF-8

# Test & Coverage Reporting
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=backend/junit.xml,frontend/junit.xml

# Quality Gate Thresholds
sonar.qualitygate.wait=true
