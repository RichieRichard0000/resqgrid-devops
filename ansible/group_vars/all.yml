---
# ==============================================================================
# Global Group Variables for ResQGrid Managed Servers
# Project: ResQGrid — Real-Time Disaster Alert & Response Platform
# ==============================================================================

# Operating System Targets
target_os_distribution: "Ubuntu"
target_os_version_min: "22.04"

# Baseline system utilities required for ResQGrid operations
baseline_packages:
  - curl
  - wget
  - git
  - htop
  - jq
  - unzip
  - ca-certificates
  - apt-transport-https
  - gnupg
  - lsb-release
  - build-essential

# Package cache management (1 hour validity)
apt_cache_valid_time: 3600

# Docker service state
docker_service_name: "docker"
docker_service_state: "started"
docker_service_enabled: true

# Kubernetes (k3s) service state
k3s_service_name: "k3s"
k3s_service_state: "started"
k3s_service_enabled: true

# Application workspace configuration
app_workspace_dir: "/home/ubuntu/workspace/resqgrid"
app_workspace_owner: "ubuntu"
app_workspace_group: "ubuntu"

# Resource threshold guidelines for health assertions
min_free_mem_mb: 256
min_free_disk_gb: 5
