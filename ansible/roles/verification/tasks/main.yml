---
# ==============================================================================
# Tasks for role: verification
# ==============================================================================

- name: "[Verification] Check for kubectl binary"
  ansible.builtin.command: which kubectl
  register: kubectl_bin_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[Verification] Assert kubectl is installed"
  ansible.builtin.assert:
    that:
      - kubectl_bin_check.rc == 0
    fail_msg: "kubectl CLI was not found on target host."
    success_msg: "kubectl CLI found at: {{ kubectl_bin_check.stdout }}"

- name: "[Verification] Check for k3s binary"
  ansible.builtin.command: which k3s
  register: k3s_bin_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[Verification] Assert k3s binary is installed"
  ansible.builtin.assert:
    that:
      - k3s_bin_check.rc == 0
    fail_msg: "k3s binary was not found on target host."
    success_msg: "k3s binary found at: {{ k3s_bin_check.stdout }}"

- name: "[Verification] Ensure k3s service is active and enabled on boot"
  ansible.builtin.service:
    name: "{{ k3s_service_name }}"
    state: "{{ k3s_service_state }}"
    enabled: "{{ k3s_service_enabled }}"
  become: true

- name: "[Verification] Query Kubernetes cluster nodes"
  ansible.builtin.command: kubectl get nodes -o wide
  register: k8s_nodes_output
  changed_when: false
  check_mode: false

- name: "[Verification] Query ResQGrid application workloads in resqgrid namespace"
  ansible.builtin.command: kubectl get pods -n resqgrid -o wide
  register: k8s_pods_output
  changed_when: false
  check_mode: false

- name: "[Verification] Assert critical ResQGrid pods are running"
  ansible.builtin.assert:
    that:
      - "'backend-deployment' in k8s_pods_output.stdout"
      - "'frontend-deployment' in k8s_pods_output.stdout"
      - "'postgres-deployment' in k8s_pods_output.stdout"
    fail_msg: "One or more critical ResQGrid pods are missing or not scheduled."
    success_msg: "Core ResQGrid workloads (backend, frontend, postgres) are scheduled."

- name: "[Verification] Collect root filesystem storage statistics"
  ansible.builtin.set_fact:
    root_mount: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first }}"

- name: "[Verification] Assert sufficient disk and memory headroom exists"
  ansible.builtin.assert:
    that:
      - (root_mount.size_available / 1024 / 1024 / 1024) >= min_free_disk_gb
    fail_msg: "Root volume has less than {{ min_free_disk_gb }} GB free space remaining."
    success_msg: "Disk headroom verified: {{ (root_mount.size_available / 1024 / 1024 / 1024) | round(2) }} GB available on /."

- name: "[Verification] Display final ResQGrid host and workload summary"
  ansible.builtin.debug:
    msg:
      - "================================================================="
      - "              RESQGRID HOST CONFIGURATION AUDIT                  "
      - "================================================================="
      - "Host: {{ inventory_hostname }} ({{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} {{ ansible_facts['architecture'] }})"
      - "Kernel: {{ ansible_facts['kernel'] }}"
      - "Total Memory: {{ ansible_facts['memtotal_mb'] }} MB (Free: {{ ansible_facts['memfree_mb'] }} MB)"
      - "Root Storage: {{ (root_mount.size_available / 1024 / 1024 / 1024) | round(2) }} GB free of {{ (root_mount.size_total / 1024 / 1024 / 1024) | round(2) }} GB"
      - "Docker Status: active (version {{ docker_version_output.stdout | default('N/A') }})"
      - "k3s Status: active"
      - "SonarQube Kernel Tuning: vm.max_map_count={{ sonar_max_map_count | default('262144') }} (verified)"
      - "Workspace: {{ app_workspace_dir }} (verified)"
      - "================================================================="
      - "                  KUBERNETES WORKLOADS AUDIT                     "
      - "================================================================="
      - "{{ k8s_nodes_output.stdout_lines }}"
      - "-----------------------------------------------------------------"
      - "{{ k8s_pods_output.stdout_lines }}"
      - "================================================================="
