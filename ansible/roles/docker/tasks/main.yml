---
# ==============================================================================
# Tasks for role: docker
# ==============================================================================

- name: "[Docker] Check for Docker CLI binary"
  ansible.builtin.command: which docker
  register: docker_bin_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[Docker] Assert Docker CLI is installed"
  ansible.builtin.assert:
    that:
      - docker_bin_check.rc == 0
    fail_msg: "Docker binary not found. Docker must be provisioned before running this role."
    success_msg: "Docker binary found at: {{ docker_bin_check.stdout }}"

- name: "[Docker] Ensure Docker service is active and enabled on boot"
  ansible.builtin.service:
    name: "{{ docker_daemon_service }}"
    state: "{{ docker_target_state }}"
    enabled: "{{ docker_start_on_boot }}"
  become: true

- name: "[Docker] Retrieve Docker server version"
  ansible.builtin.command: docker version --format '{% raw %}{{.Server.Version}}{% endraw %}'
  register: docker_version_output
  changed_when: false
  check_mode: false

- name: "[Docker] Retrieve active Docker containers"
  ansible.builtin.command: docker ps --format '{% raw %}{{.Names}} ({{.Status}}){% endraw %}'
  register: docker_containers_output
  changed_when: false
  check_mode: false

- name: "[Docker] Display Docker runtime status"
  ansible.builtin.debug:
    msg:
      - "Docker Version: {{ docker_version_output.stdout }}"
      - "Active Containers:"
      - "{{ docker_containers_output.stdout_lines }}"
