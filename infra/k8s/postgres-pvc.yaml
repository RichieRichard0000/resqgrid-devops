# ==============================================================================
# PersistentVolumeClaim for PostGIS Database
# Project: ResQGrid — Real-Time Disaster Alert & Response Platform
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: resqgrid-platform
spec:
  accessModes:
    - ReadWriteOnce
  # Omit storageClassName to bind the cluster default StorageClass (hostpath on Docker Desktop, local-path on k3s)
  resources:
    requests:
      storage: 10Gi
