# ==============================================================================
# Ingress Controller Routing
# Project: ResQGrid — Real-Time Disaster Alert & Response Platform
# Principle: Unified entry point routing REST API, WebSockets, and SPA Frontend
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resqgrid-ingress
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: resqgrid-ingress
    app.kubernetes.io/part-of: resqgrid-platform
  annotations:
    kubernetes.io/ingress.class: "traefik" # Compatible with k3s default Traefik or nginx
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    # WebSocket support annotations for long-lived real-time connections
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - http:
        paths:
          # REST API Endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000

          # Real-Time WebSocket Endpoint (Socket.IO)
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000

          # Health Check Endpoint
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000

          # Metrics Scraping Endpoint (Restrict to Prometheus in production)
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000

          # Frontend Single Page Application (Catch-all root path)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
