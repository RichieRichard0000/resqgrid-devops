# ==============================================================================
# Kubernetes Secret for ResQGrid
# Project: ResQGrid — Real-Time Disaster Alert & Response Platform
#
# NOTE: In production environments, manage secrets via HashiCorp Vault, AWS Secrets
# Manager (via External Secrets Operator), or SealedSecrets. Do NOT commit plaintext
# production credentials to Git repositories.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: resqgrid-secrets
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: resqgrid
    app.kubernetes.io/part-of: resqgrid-platform
type: Opaque
stringData:
  DB_USER: "resqgrid_user"
  DB_PASSWORD: "resqgrid_secure_password_replace_in_prod"
  JWT_SECRET: "resqgrid_super_secret_jwt_key_at_least_32_chars_long_production"
