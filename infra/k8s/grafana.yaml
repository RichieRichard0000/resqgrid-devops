apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: resqgrid-platform
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 10s
          httpMethod: POST
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: resqgrid-platform
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'ResQGrid'
        orgId: 1
        folder: 'ResQGrid'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-resqgrid
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: resqgrid-platform
data:
  resqgrid-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Application Traffic & Performance",
          "type": "row"
        },
        {
          "id": 1,
          "title": "HTTP Request Throughput (req/sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (method, route)",
              "legendFormat": "{{method}} {{route}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 15, "lineWidth": 2 } }
          }
        },
        {
          "id": 2,
          "title": "HTTP Request Latency Quantiles (p50, p95, p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p50 (Median)",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "fillOpacity": 10, "lineWidth": 2 } }
          }
        },
        {
          "id": 3,
          "title": "HTTP Responses by Status Code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (status_code)",
              "legendFormat": "Status {{status_code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 20, "lineWidth": 2 } }
          }
        },
        {
          "id": 4,
          "title": "Active Socket.IO Real-Time Clients",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "targets": [
            {
              "expr": "sum(active_socket_connections)",
              "legendFormat": "Active Connections",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none", "custom": { "fillOpacity": 30, "lineWidth": 2 } }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "id": 101,
          "title": "Disaster Pipeline & Reliability",
          "type": "row"
        },
        {
          "id": 5,
          "title": "Disaster Events Ingested vs Broadcast",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "targets": [
            {
              "expr": "sum(rate(disaster_events_ingested_total[1m])) by (provider, is_simulated)",
              "legendFormat": "Ingested ({{provider}}, simulated: {{is_simulated}})",
              "refId": "A"
            },
            {
              "expr": "sum(rate(alerts_broadcast_total[1m])) by (severity)",
              "legendFormat": "Alert Broadcast ({{severity}})",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "fillOpacity": 15, "lineWidth": 2 } }
          }
        },
        {
          "id": 6,
          "title": "Application Errors Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "targets": [
            {
              "expr": "sum(rate(application_errors_total[1m])) by (error_type, component)",
              "legendFormat": "{{component}} - {{error_type}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "errps", "custom": { "fillOpacity": 20, "lineWidth": 2 } }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "id": 102,
          "title": "Runtime Resources & HPA Scalability",
          "type": "row"
        },
        {
          "id": 7,
          "title": "Process CPU Usage (HPA Trigger)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 27 },
          "targets": [
            {
              "expr": "rate(process_cpu_user_seconds_total[1m]) + rate(process_cpu_system_seconds_total[1m])",
              "legendFormat": "CPU Core Utilization",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "custom": { "fillOpacity": 20, "lineWidth": 2 } }
          }
        },
        {
          "id": 8,
          "title": "Node.js Heap Memory & Event Loop Lag",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 27 },
          "targets": [
            {
              "expr": "nodejs_heap_size_used_bytes",
              "legendFormat": "Heap Used",
              "refId": "A"
            },
            {
              "expr": "nodejs_heap_size_total_bytes",
              "legendFormat": "Heap Total",
              "refId": "B"
            },
            {
              "expr": "nodejs_eventloop_lag_seconds",
              "legendFormat": "Event Loop Lag (s)",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "fillOpacity": 15, "lineWidth": 2 } }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["resqgrid", "srmist", "devops", "monitoring"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"] },
      "timezone": "browser",
      "title": "ResQGrid Platform Overview",
      "uid": "resqgrid-overview",
      "version": 1
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: resqgrid-platform
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: resqgrid
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: resqgrid-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.3.3
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-resqgrid-volume
              mountPath: /var/lib/grafana/dashboards
            - name: storage-volume
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources
        - name: dashboards-provider-volume
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-resqgrid-volume
          configMap:
            name: grafana-dashboard-resqgrid
        - name: storage-volume
          emptyDir: {}
