# ==============================================================================
# PostGIS ClusterIP Service
# Project: ResQGrid — Real-Time Disaster Alert & Response Platform
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: resqgrid-platform
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - port: 5433
      targetPort: 5433
      protocol: TCP
      name: postgres
