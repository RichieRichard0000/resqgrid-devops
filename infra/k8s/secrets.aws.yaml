# ==============================================================================
# Kubernetes Secret for ResQGrid (AWS In-Cluster Target)
# Project: ResQGrid — Real-Time Disaster Alert & Response Platform
# In AWS, the backend connects to in-cluster postgres-service on port 5432.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: resqgrid-secrets
  namespace: resqgrid
  labels:
    app.kubernetes.io/name: resqgrid
    app.kubernetes.io/part-of: resqgrid-platform
type: Opaque
stringData:
  DB_USER: "resqgrid_user"
  DB_PASSWORD: "resqgrid_password"
  JWT_SECRET: "resqgrid_super_secret_jwt_key_at_least_32_chars_long_production"
  DATABASE_URL: "postgresql://resqgrid_user:resqgrid_password@postgres-service:5432/resqgrid"
