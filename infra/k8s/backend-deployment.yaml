# ==============================================================================
# Backend API & WebSocket Deployment
# Project: ResQGrid — Real-Time Disaster Alert & Response Platform
# Security: Non-root UID 10001, read-only root FS, dropped Linux capabilities
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: resqgrid
  labels:
    app: backend
    release: blue
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: resqgrid-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
      release: blue
  template:
    metadata:
      labels:
        app: backend
        release: blue
        app.kubernetes.io/name: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ecr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: 016626013328.dkr.ecr.ap-south-1.amazonaws.com/resqgrid-backend:phase5-20261109
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: resqgrid-config
          env:
            - name: RELEASE_COLOR
              value: "blue"
            - name: RELEASE_COMMIT
              value: "phase5-20261109"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: resqgrid-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resqgrid-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resqgrid-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: resqgrid-secrets
                  key: JWT_SECRET
            # In Kubernetes pods, bind to 0.0.0.0
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
